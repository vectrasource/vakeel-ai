<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sign In — Vakeel AI</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --gold:#d4a017;--gold-light:#f0c040;--gold-dim:rgba(212,160,23,0.12);--gold-border:rgba(212,160,23,0.25);
  --bg:#07070e;--bg2:#0d0d18;--surface:rgba(255,255,255,0.04);
  --text:#ede8dc;--text-dim:rgba(237,232,220,0.5);--text-faint:rgba(237,232,220,0.25);
  --radius:10px;
}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}

#bg-glow{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 30% 20%,rgba(212,160,23,0.06) 0%,transparent 55%),
             radial-gradient(ellipse at 75% 80%,rgba(140,90,10,0.08) 0%,transparent 55%);}

.card{position:relative;z-index:1;width:100%;max-width:420px;
  background:var(--bg2);border:1px solid var(--gold-border);
  border-radius:18px;overflow:hidden;box-shadow:0 32px 80px rgba(0,0,0,0.55);}

.card-bar{height:3px;background:linear-gradient(90deg,#b8860b,#f0c040,#d4a017);}

.card-body{padding:36px 32px;}

.brand{display:flex;align-items:center;gap:10px;margin-bottom:28px;}
.brand-logo{width:38px;height:38px;background:linear-gradient(135deg,#b8860b,#f0c040);
  border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;
  box-shadow:0 4px 15px rgba(212,160,23,0.3);}
.brand-name{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:900;
  background:linear-gradient(135deg,var(--gold),var(--gold-light));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;}

.tabs{display:flex;background:rgba(255,255,255,0.03);border:1px solid var(--gold-border);
  border-radius:var(--radius);padding:3px;gap:3px;margin-bottom:24px;}
.tab{flex:1;padding:8px;border-radius:8px;font-size:13px;font-weight:600;border:none;
  cursor:pointer;transition:all 0.15s;background:transparent;color:var(--text-dim);font-family:'DM Sans',sans-serif;}
.tab.active{background:var(--gold-dim);color:var(--gold);border:1px solid rgba(212,160,23,0.3);}

.google-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  padding:11px;background:#fff;border:none;border-radius:var(--radius);
  font-size:14px;font-weight:600;color:#1e293b;cursor:pointer;transition:all 0.15s;
  margin-bottom:18px;font-family:'DM Sans',sans-serif;}
.google-btn:hover{background:#f1f5f9;}

.divider{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--gold-border);}
.divider span{font-size:12px;color:var(--text-faint);}

.field{margin-bottom:14px;}
.field input{width:100%;background:rgba(255,255,255,0.03);border:1px solid rgba(212,160,23,0.2);
  border-radius:var(--radius);color:var(--text);font-size:14px;padding:11px 14px;
  outline:none;font-family:'DM Sans',sans-serif;transition:border-color 0.15s;}
.field input:focus{border-color:rgba(212,160,23,0.5);}
.field input::placeholder{color:var(--text-faint);}

.error-box{display:none;background:rgba(224,85,85,0.08);border:1px solid rgba(224,85,85,0.28);
  border-radius:var(--radius);padding:10px 14px;font-size:13px;color:#fca5a5;margin-bottom:14px;}

.submit-btn{width:100%;padding:13px;border-radius:var(--radius);font-size:14px;font-weight:700;
  cursor:pointer;border:none;background:linear-gradient(135deg,#b8860b,#f0c040);
  color:#07070e;transition:all 0.2s;box-shadow:0 0 20px rgba(212,160,23,0.2);
  font-family:'DM Sans',sans-serif;letter-spacing:0.3px;}
.submit-btn:hover{box-shadow:0 0 30px rgba(212,160,23,0.4);transform:translateY(-1px);}
.submit-btn:disabled{opacity:0.6;cursor:not-allowed;transform:none;}

.footer-text{text-align:center;font-size:12px;color:var(--text-faint);margin-top:16px;}
.footer-text button{background:none;border:none;color:var(--gold);font-size:12px;
  font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;}

.back-link{display:block;text-align:center;margin-top:20px;font-size:12px;
  color:var(--text-faint);text-decoration:none;transition:color 0.15s;}
.back-link:hover{color:var(--gold);}
</style>
</head>
<body>
<div id="bg-glow"></div>

<div class="card">
  <div class="card-bar"></div>
  <div class="card-body">

    <div class="brand">
      <div class="brand-logo">⚖️</div>
      <span class="brand-name">Vakeel AI</span>
    </div>

    <div class="tabs">
      <button class="tab active" id="tab-signin" onclick="switchTab('signin')">Sign In</button>
      <button class="tab" id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <!-- Google -->
    <button class="google-btn" onclick="handleGoogle()">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.47 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google
    </button>

    <div class="divider"><span>or</span></div>

    <!-- Name field (signup only) -->
    <div class="field" id="field-name" style="display:none;">
      <input type="text" id="inp-name" placeholder="Full name"/>
    </div>

    <div class="field">
      <input type="email" id="inp-email" placeholder="Email address"/>
    </div>
    <div class="field">
      <input type="password" id="inp-password" placeholder="Password"
        onkeydown="if(event.key==='Enter')submitAuth()"/>
    </div>

    <div class="error-box" id="error-box"></div>

    <button class="submit-btn" id="submit-btn" onclick="submitAuth()">Sign In</button>

    <p class="footer-text" id="footer-text">
      Don't have an account? <button onclick="switchTab('signup')">Sign up free</button>
    </p>
  </div>
</div>

<a href="index.html" class="back-link">← Back to Vakeel AI</a>

<script src="auth.js"></script>
<script>
  // If already logged in, go straight to app
  (async () => {
    const session = await getSession();
    if (session) window.location.href = 'app.html';
  })();

  let currentTab = 'signin';

  function switchTab(tab) {
    currentTab = tab;
    const isSignup = tab === 'signup';
    document.getElementById('tab-signin').classList.toggle('active', !isSignup);
    document.getElementById('tab-signup').classList.toggle('active', isSignup);
    document.getElementById('field-name').style.display = isSignup ? 'block' : 'none';
    document.getElementById('submit-btn').textContent = isSignup ? 'Create Account' : 'Sign In';
    document.getElementById('footer-text').innerHTML = isSignup
      ? `Already have an account? <button onclick="switchTab('signin')">Sign in</button>`
      : `Don't have an account? <button onclick="switchTab('signup')">Sign up free</button>`;
    document.getElementById('error-box').style.display = 'none';
  }

  function showError(msg) {
    const el = document.getElementById('error-box');
    el.textContent = msg;
    el.style.background = 'rgba(224,85,85,0.08)';
    el.style.borderColor = 'rgba(224,85,85,0.28)';
    el.style.color = '#fca5a5';
    el.style.display = 'block';
  }

  function showSuccess(msg) {
    const el = document.getElementById('error-box');
    el.textContent = msg;
    el.style.background = 'rgba(74,222,128,0.08)';
    el.style.borderColor = 'rgba(74,222,128,0.28)';
    el.style.color = '#86efac';
    el.style.display = 'block';
  }

  async function handleGoogle() {
    try { await signInWithGoogle(); }
    catch (e) { showError(e.message); }
  }

  async function submitAuth() {
    const btn      = document.getElementById('submit-btn');
    const email    = document.getElementById('inp-email').value.trim();
    const password = document.getElementById('inp-password').value;
    const name     = document.getElementById('inp-name').value.trim();

    if (!email || !password) { showError('Please fill in all fields.'); return; }
    if (currentTab === 'signup' && !name) { showError('Please enter your full name.'); return; }

    btn.textContent = 'Please wait…';
    btn.disabled = true;
    document.getElementById('error-box').style.display = 'none';

    try {
      if (currentTab === 'signup') {
        await signUpWithEmail(email, password, name);
        showSuccess('Account created! Signing you in...');
        await signInWithEmail(email, password);
        window.location.href = 'app.html';
      } else {
        await signInWithEmail(email, password);
        window.location.href = 'app.html';
      }
    } catch (e) {
      showError(e.message);
      btn.textContent = currentTab === 'signup' ? 'Create Account' : 'Sign In';
    } finally {
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
